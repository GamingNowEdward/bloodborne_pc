name: build-windows-cn

on:
  push:
    branches: [windows-cn]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2 CLANG64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: >-
            git patch curl
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross

      - name: Fetch Noto Sans SC font (embedded by the build)
        run: |
          curl -L --fail --retry 3 -o gpu/third_party/fonts/NotoSansSC-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf"
          curl -L --fail --retry 3 -o gpu/third_party/fonts/LICENSE-NotoSansSC.txt "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/OFL.txt"
          ls -la gpu/third_party/fonts/

      - name: Build bb-probe.exe
        run: bash build.sh

      - name: Strip debug info (same as the official package)
        run: |
          llvm-strip --strip-debug out/bb-probe.exe
          ls -la out/bb-probe.exe

      - name: List output
        run: ls -la out/

      - name: Upload bb-probe.exe
        uses: actions/upload-artifact@v4
        with:
          name: bb-probe-cn
          path: out/bb-probe.exe
          if-no-files-found: error
